spring.application.name=crane-management-system

# 1. Database Connection Settings
spring.datasource.url=jdbc:postgresql://localhost:5432/crane_management_system
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

# 2. JPA & Hibernate Platform Settings
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# 3. Schema Management Strategy (e.g., validate, update, create-drop)
spring.jpa.hibernate.ddl-auto=update

# 4. Log generated SQL queries to console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT secret
jwt.secret=${JWT_SECRET}
